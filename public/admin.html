<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>GI Open House — Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0f1b3d; --accent:#ffc94d; --ink:#18203a; --muted:#5d6680; --bg-alt:#f4f6fb; --line:#e2e6f0; --ok:#10b981; --err:#d93a3a; --radius:14px; --shadow:0 6px 24px rgba(15,27,61,.08);
      font-family:"IBM Plex Sans Thai",system-ui,sans-serif; color:var(--ink); }
    * { box-sizing:border-box; } body { margin:0; }
    .wrap { width:min(1120px,100% - 2.5rem); margin-inline:auto; }
    .muted { color:var(--muted); } .form-error { color:var(--err); font-weight:600; }
    .btn { background:var(--accent); color:#3a2a00; border:0; border-radius:999px; padding:.6em 1.2em; font:inherit; font-weight:600; cursor:pointer; }
    .btn-ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px currentColor; }
    body { background: var(--bg-alt); }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; }
    .kpi b { display: block; font-size: 1.7rem; color: var(--navy); }
    .bar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .bar input { font: inherit; padding: .6em .8em; border: 1.5px solid var(--line); border-radius: 10px; min-height: 44px; flex: 1; min-width: 160px; }
    #checkCode { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
    .result { margin-top: .8rem; padding: .8rem 1rem; border-radius: 10px; display: none; }
    .result.ok { display: block; background: #e7f8f1; color: #065f46; }
    .result.warn { display: block; background: #fff6e0; color: #7a5200; }
    .result.err { display: block; background: #fdeaea; color: #8a1f1f; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { background: var(--bg-alt); position: sticky; top: 0; }
    .table-wrap { overflow: auto; max-height: 60vh; }
    .yes { color: var(--ok); font-weight: 700; }
    h1 { font-size: 1.5rem; margin: 1.5rem 0 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GI Open House — Staff</h1>

    <div class="panel" id="loginPanel">
      <p class="muted" style="margin-top:0">Enter the admin key to continue.</p>
      <form class="bar" id="loginForm">
        <input type="password" id="key" placeholder="Admin key" autocomplete="current-password" required />
        <button class="btn" type="submit">Unlock</button>
      </form>
      <p class="form-error" id="loginErr"></p>
    </div>

    <div id="app" hidden>
      <div class="kpis" id="kpis"></div>

      <div class="panel" style="margin-top:1rem">
        <h2 style="font-size:1.15rem">Check in</h2>
        <form class="bar" id="checkForm">
          <input id="checkCode" placeholder="CODE" maxlength="12" autocomplete="off" autocapitalize="characters" required />
          <button class="btn" type="submit">Check in</button>
        </form>
        <div class="result" id="checkResult"></div>
      </div>

      <div class="panel">
        <div class="bar" style="margin-bottom:.8rem">
          <input id="search" placeholder="Search name, email, phone, code…" />
          <button class="btn btn-ghost" type="button" id="refreshBtn">Refresh</button>
          <button class="btn" type="button" id="csvBtn">Download CSV</button>
          <button class="btn btn-ghost" type="button" id="logoutBtn">Lock</button>
        </div>
        <div class="table-wrap"><table><thead><tr>
          <th>Code</th><th>Name</th><th>Session</th><th>People</th><th>Role</th><th>Grade</th><th>Phone</th><th>Email</th><th>School</th><th>In</th><th>Registered</th>
        </tr></thead><tbody id="rows"></tbody></table></div>
      </div>
    </div>
  </div>

<script type="module">
import { SESSIONS } from "/content.js";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let key = (() => { try { return sessionStorage.getItem("gi-admin") || ""; } catch { return ""; } })();
let data = [];

const api = (path, opts = {}) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: `Bearer ${key}` } });

async function load() {
  const res = await api("/api/admin/registrations");
  if (res.status === 401 || res.status === 503) {
    $("#loginErr").textContent = res.status === 503 ? "Admin is disabled: set the ADMIN_KEY secret in Cloudflare." : "Wrong key.";
    $("#app").hidden = true; $("#loginPanel").hidden = false;
    return;
  }
  data = (await res.json()).registrations;
  $("#app").hidden = false; $("#loginPanel").hidden = true;
  render();
}

function render() {
  const people = (rows) => rows.reduce((n, r) => n + r.guests, 0);
  const kpi = [
    ["Registrations", data.length],
    ["People", people(data)],
    ["Checked in", people(data.filter((r) => r.checked_in))],
    ...SESSIONS.map((s) => [s.label.en, `${people(data.filter((r) => r.session === s.id))} / ${s.capacity}`]),
  ];
  $("#kpis").innerHTML = kpi.map(([l, v]) => `<div class="kpi"><span class="muted">${esc(l)}</span><b>${esc(v)}</b></div>`).join("");

  const q = $("#search").value.trim().toLowerCase();
  const rows = q ? data.filter((r) => [r.code, r.name, r.email, r.phone, r.school].some((v) => String(v || "").toLowerCase().includes(q))) : data;
  const label = (id) => SESSIONS.find((s) => s.id === id)?.label.en || id;
  $("#rows").innerHTML = rows.map((r) => `<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.name)}</td><td>${esc(label(r.session))}</td><td>${r.guests}</td>
    <td>${esc(r.role)}</td><td>${esc(r.grade)}</td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td>${esc(r.school)}</td>
    <td>${r.checked_in ? '<span class="yes">✓</span>' : ""}</td><td>${esc(r.created_at)}</td></tr>`).join("");
}

$("#loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  key = $("#key").value;
  try { sessionStorage.setItem("gi-admin", key); } catch {}
  load();
});
$("#logoutBtn").addEventListener("click", () => { key = ""; try { sessionStorage.removeItem("gi-admin"); } catch {} location.reload(); });
$("#refreshBtn").addEventListener("click", load);
$("#search").addEventListener("input", render);

$("#csvBtn").addEventListener("click", async () => {
  const res = await api("/api/admin/registrations?format=csv");
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement("a"), { href: url, download: "gi-openhouse-registrations.csv" });
  a.click(); URL.revokeObjectURL(url);
});

$("#checkForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = $("#checkResult");
  const code = $("#checkCode").value.trim().toUpperCase();
  const res = await api("/api/admin/checkin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) { box.className = "result err"; box.textContent = out.error === "not_found" ? `No registration with code ${code}.` : "Error, try again."; return; }
  const r = out.registration;
  const label = SESSIONS.find((s) => s.id === r.session)?.label.en || r.session;
  box.className = out.already ? "result warn" : "result ok";
  box.innerHTML = `${out.already ? "⚠️ Already checked in before — " : "✅ Checked in: "}<b>${esc(r.name)}</b> · ${esc(label)} · ${r.guests} people`;
  $("#checkCode").value = ""; $("#checkCode").focus();
  load();
});

if (key) load();
</script>
</body>
</html>
